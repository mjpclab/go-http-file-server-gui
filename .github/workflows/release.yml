name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve latest tag
        id: tag
        run: |
          TAG=$(git describe --tags --abbrev=0)
          if [ -z "$TAG" ]; then
            echo "no tags found" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git checkout "$TAG"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build all targets
        run: bash build/build-all.sh

      - name: Package Linux distro packages (.deb, .rpm, Arch, apk)
        run: bash build/pack-linux.sh

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Package Windows installers
        run: bash build/pack-windows.sh

      - name: Package MacOS apps
        run: bash build/pack-darwin.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "$TAG" output/* --generate-notes
