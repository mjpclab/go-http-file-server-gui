name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG=$(git describe --tags --abbrev=0)
          fi
          if [ -z "$TAG" ]; then
            echo "no tags found" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git checkout "$TAG"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build all targets
        run: bash build/build-all.sh

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Package all platforms
        run: bash build/pack-all.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release create "$TAG" output/* --generate-notes
