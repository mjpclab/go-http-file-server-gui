# nfpm config shared by every Linux package format (.deb/.rpm/Arch/apk).
# `${PKG_ARCH}` and `${VERSION}` are expanded by nfpm from the environment;
# build/pack-linux.sh exports them once per architecture.
name: ghfs-gui
arch: ${PKG_ARCH}
version: ${VERSION}
version_schema: none
maintainer: MJ PC Lab
description: GUI wrapper for go-http-file-server, share local files over HTTP.
homepage: "https://github.com/mjpclab/go-http-file-server-gui"
license: MIT
section: net
priority: optional
contents:
  - src: pkgroot/ghfs-gui
    dst: /usr/bin/ghfs-gui
  - src: build/ghfs-gui.desktop
    dst: /usr/share/applications/ghfs-gui.desktop
    file_info:
      mode: 0644
  - src: Icon.png
    dst: /usr/share/icons/hicolor/32x32/apps/ghfs-gui.png
    file_info:
      mode: 0644
